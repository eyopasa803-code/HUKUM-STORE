<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HÜKÜM STORE: Zırhlı Dijital İmparatorluk</title>
<style>
:root{
  --bg:#F1F3F6; --card:#FFFFFF; --ink:#0E1B2C; --mute:#5E6E80; --line:#DDE2E8;
  --red:#C8232C; --on-red:#FFFFFF; --brass:#B8892B; --ok:#1E7A4F; --chip:#E4E8ED;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A1320;--card:#13233A;--ink:#EDF1F5;--mute:#98A8BA;--line:#25374F;--red:#E5444C;--brass:#D9A93F;--ok:#4CC38A;--chip:#1B2E48}
}
:root[data-theme="dark"]{--bg:#0A1320;--card:#13233A;--ink:#EDF1F5;--mute:#98A8BA;--line:#25374F;--red:#E5444C;--brass:#D9A93F;--ok:#4CC38A;--chip:#1B2E48}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:72px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 12px 8px}
.bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:4px 6px;min-height:50px}
.ib{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.ib:active{background:var(--chip)}
.sbtn{flex:1;text-align:left;border:0;background:none;color:var(--mute);font-size:15px;padding:10px 4px}
.av{width:34px;height:34px;border-radius:50%;background:var(--red);color:var(--on-red);font-weight:800;display:grid;place-items:center;border:0;flex:none;margin-right:3px}
.page{padding:6px 14px 20px}
.back{display:flex;align-items:center;gap:6px;padding:4px 0 10px;font-weight:700;font-size:18px}
.back button{border:0;background:none;font-size:22px;width:36px;height:36px;border-radius:50%}

/* kartlar */
h2{font-size:18px;margin:20px 0 10px;letter-spacing:-.2px}
.hero{border-radius:16px;padding:18px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:21px;letter-spacing:-.5px;line-height:1.2;max-width:85%}
.hero p{margin:0 0 14px;font-size:14px;opacity:.85;max-width:85%}
.hero .mark{position:absolute;right:-18px;top:-18px;width:110px;height:110px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:48px;font-weight:900;color:var(--on-red);opacity:.95;padding:30px 0 0 0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--red);color:var(--on-red);min-height:46px}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:8px 16px;min-height:38px;font-size:14px;border-radius:20px}
.btn.full{width:100%}
.btn.on-dark{background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chip{border:0;background:var(--chip);padding:8px 16px;border-radius:20px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tile{flex:0 0 108px;text-align:left;border:0;background:none;padding:0}
.tile .ico{width:108px;height:108px;font-size:48px;border-radius:24px}
.tile b{display:block;font-size:14px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font-size:12px;color:var(--mute)}
.ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;font-size:30px;flex:none;color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.item .m{flex:1;min-width:0}
.item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m span{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--mute);font-size:14px}
.stats{display:flex;text-align:center;margin:14px 0}
.stats div{flex:1}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mute)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute);vertical-align:middle;margin-left:6px}
.badge.red{background:var(--red);color:var(--on-red)}
.badge.brass{background:var(--brass);color:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.token{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--chip);padding:8px 10px;border-radius:8px;word-break:break-all}
.row{display:flex;gap:10px;align-items:center}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set small{display:block;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.empty .big{font-size:42px}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
summary{font-weight:600;padding:8px 0}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.gi{border:0;background:none;padding:0;text-align:center;min-width:0}
.gi .ico{width:100%;height:auto;aspect-ratio:1;max-width:72px;margin:0 auto;font-size:34px;border-radius:18px}
.gi span{display:block;font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* alt menü */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--mute);font-weight:600;min-height:56px}
nav button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
nav button[aria-current="true"]{color:var(--red)}

/* yan menü */
.scrim{position:fixed;inset:0;background:rgba(5,10,18,.55);z-index:30;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:31;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);overflow-y:auto}
.drawer.open{transform:none}
.dh{padding:20px 18px;background:var(--ink);color:var(--bg)}
.dh .seal{width:52px;height:52px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center;font-weight:900;font-size:24px;box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 5px rgba(255,255,255,.55);margin-bottom:10px}
.dh b{font-size:18px;letter-spacing:-.4px}
.dh div{font-size:13px;opacity:.8}
.dl button{display:flex;align-items:center;gap:16px;width:100%;border:0;background:none;padding:14px 20px;font-size:15px;font-weight:600;text-align:left}
.dl button:active{background:var(--chip)}
.dl hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.sheet-bg{position:fixed;inset:0;background:rgba(5,10,18,.6);z-index:40;display:none;align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.runner{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.runner.open{display:flex}
.runner .rb{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.runner iframe{flex:1;border:0;width:100%;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:90%;text-align:center}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width 1.1s linear}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C8232C">
</head>
<body>

<div class="wrap">
  <div class="top" id="top">
    <div class="bar">
      <button class="ib" onclick="openDrawer()" aria-label="Menü">☰</button>
      <button class="sbtn" onclick="tabTo('search')">HÜKÜM STORE'da ara</button>
      <button class="av" id="avBtn" onclick="tabTo('profile')" aria-label="Profil">?</button>
    </div>
  </div>
  <main id="view" class="page"></main>
</div>

<nav aria-label="Ana menü">
  <button data-tab="home" onclick="tabTo('home')"><i>🏪</i>Mağaza</button>
  <button data-tab="search" onclick="tabTo('search')"><i>🔎</i>Ara</button>
  <button data-tab="rewards" onclick="tabTo('rewards')"><i>🎁</i>Ödül</button>
  <button data-tab="dev" onclick="tabTo('dev')"><i>🛠️</i>Geliştir</button>
  <button data-tab="profile" onclick="tabTo('profile')"><i>👤</i>Profil</button>
</nav>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-label="Yan menü">
  <div class="dh"><div class="seal">H</div><b>HÜKÜM STORE</b><div id="dUser">Giriş yapılmadı</div></div>
  <div class="dl">
    <button onclick="dgo('home')"><span>🏪</span>Mağaza</button>
    <button onclick="dgo('home','oyun')"><span>🎮</span>Oyunlar</button>
    <button onclick="dgo('home','uygulama')"><span>📱</span>Uygulamalar</button>
    <button onclick="dgo('library')"><span>📥</span>Kurduklarım</button>
    <hr>
    <button onclick="dgo('rewards')"><span>🎁</span>Ödüller ve görevler</button>
    <button onclick="dgo('leaderboard')"><span>🏆</span>Sıralama</button>
    <button onclick="dgo('favs')"><span>⭐</span>Favorilerim</button>
    <button onclick="dgo('dev')"><span>🛠️</span>Geliştirici paneli</button>
    <hr>
    <button onclick="dgo('profile')"><span>👤</span>Profilim</button>
    <button onclick="dgo('settings')"><span>⚙️</span>Ayarlar</button>
    <button onclick="dgo('about')"><span>ℹ️</span>Hakkında</button>
  </div>
</aside>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="runner" id="runner"><div class="rb"><button class="ib" onclick="closeRunner()" aria-label="Kapat">✕</button><b id="runName"></b></div><iframe id="runFrame" sandbox="allow-scripts" title="Uygulama"></iframe></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* --- HÜKÜM ÇEKİRDEK VERİTABANI & SİSTEMİ --- */
var DB_KEY = "hukum_core_vault", SES_KEY = "hukum_session", SET_KEY = "hukum_settings";

/* Varsayılan Kurucu Hesabı ve Örnek Veriler */
var defaultDB = {
  users: {
    "EYO PAŞA!": { name: "EYO PAŞA!", pass: "Mr_eyo9801234509", role: "kurucu", points: 999999, xp: 999999, plan: "elmas", apps: [], favs: [], installed: [], streak: 30 }
  },
  installed: ["d1", "d2"],
  logs: [{ t: Date.now(), txt: "Sistem zırhlı çekirdek başlatıldı. Kurucu EYO PAŞA! göreve hazır." }],
  channels: [
    { id: "c_log", name: "🛡️-güvenlik-logları", msgs: [{ sender: "Sistem", text: "Zırhlı Firewall aktif edildi." }] },
    { id: "c_admin", name: "👑-admin-merkezi", msgs: [{ sender: "Kurucu", text: "Yönetim odası devrede." }] }
  ],
  tickets: []
};

function loadDB() {
  try {
    var r = localStorage.getItem(DB_KEY);
    if (r) { var d = JSON.parse(r); d.installed = d.installed || []; d.logs = d.logs || []; d.channels = d.channels || []; d.tickets = d.tickets || []; return d; }
  } catch(e) {}
  saveDB(defaultDB);
  return defaultDB;
}
function saveDB(d) { try { localStorage.setItem(DB_KEY, JSON.stringify(d)); } catch(e) {} }

function getSes() { try { return localStorage.getItem(SES_KEY); } catch(e) { return null; } }
function setSes(u) { try { u ? localStorage.setItem(SES_KEY, u) : localStorage.removeItem(SES_KEY); } catch(e) {} }

function getSet() { try { var r = localStorage.getItem(SET_KEY); if (r) return JSON.parse(r); } catch(e) {} return { theme: "auto" }; }
function putSet(s) { try { localStorage.setItem(SET_KEY, JSON.stringify(s)); } catch(e) {} }

function me() { var u = getSes(); return u ? loadDB().users[u] : null; }
function saveMe(m) { var d = loadDB(); d.users[m.name] = m; saveDB(d); }

function logAction(txt) {
  var d = loadDB();
  d.logs.unshift({ t: Date.now(), txt: txt });
  if (d.logs.length > 50) d.logs.length = 50;
  saveDB(d);
}

function esc(s) { return String(s || "").replace(/[&<>"']/g, function(c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(n) { return Number(n || 0).toLocaleString("tr-TR"); }
function toast(t) { var e = document.getElementById("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e.t); e.t = setTimeout(function() { e.style.display = "none"; }, 2600); }

var COLORS = ["#C8232C","#1F5FA8","#1E7A4F","#B8892B","#6B3FA0","#C2571A","#0E7C86","#8A2B55"];
function colorOf(id) { var h = 0; for(var i=0; i<id.length; i++) h = (h*31 + id.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }

var DEMO = [
  {id:"d1", name:"Hüküm Blok", icon:"🧱", cat:"oyun", desc:"Bloklara dokun, puanı topla.", dev:"HÜKÜM", ver:"1.0",
   code:'<body style="margin:0;font-family:sans-serif;text-align:center;background:#0E1B2C;color:#fff"><h2 style="padding-top:30px">Hüküm Blok</h2><div id=s style="font-size:48px">0</div><div id=b style="margin:30px auto;width:120px;height:120px;background:#C8232C;border-radius:14px;position:relative"></div><p>Bloğa dokun!</p><script>var n=0,b=document.getElementById("b");b.onclick=function(){n++;document.getElementById("s").textContent=n;b.style.left=((Math.random()*60)-30)+"%";b.style.top=(Math.random()*60)+"px"}<\/script></body>'},
  {id:"d2", name:"Zar At", icon:"🎲", cat:"oyun", desc:"İki zar at, şansını dene.", dev:"HÜKÜM", ver:"1.0",
   code:'<body style="margin:0;font-family:sans-serif;text-align:center;background:#1E7A4F;color:#fff"><h2 style="padding-top:30px">Zar At</h2><div id=z style="font-size:90px;margin:30px">⚀ ⚀</div><button id=r style="font-size:20px;padding:14px 30px;border:0;border-radius:12px">Zarları at</button><script>var f=["⚀","⚁","⚂","⚃","⚄","⚅"];document.getElementById("r").onclick=function(){document.getElementById("z").textContent=f[Math.floor(Math.random()*6)]+" "+f[Math.floor(Math.random()*6)]}<\/script></body>'}
];

function allApps() {
  var l = DEMO.slice(), d = loadDB();
  Object.keys(d.users).forEach(function(n) {
    (d.users[n].apps || []).forEach(function(a) {
      if(a.code) l.push({id:a.id, name:a.name, icon:a.icon||"📦", cat:a.cat||"uygulama", desc:a.desc, dev:n, ver:a.ver, code:a.code, price:a.price||0, targetUser:a.targetUser||""});
    });
  });
  return l;
}
function appById(id) { return allApps().filter(function(a) { return a.id === id; })[0]; }
function isInst(id) { return loadDB().installed.indexOf(id) > -1; }
function icoHTML(a, cls) { return '<div class="ico '+(cls||"")+'" style="background:'+colorOf(a.id)+'">'+esc(a.icon)+'</div>'; }

/* --- GEZİNME & RENDER --- */
var view = "home", vid = "", stack = [], filter = "hepsi";
function tabTo(v) { stack = []; view = v; vid = ""; render(); }
function go(v, id) { stack.push({v:view, i:vid}); view = v; vid = id||""; render(); }
function back() { var p = stack.pop(); if (p) { view = p.v; vid = p.i; } else { view = "home"; vid = ""; } render(); }
function dgo(v, f) { closeDrawer(); if(f) filter = f; else if(v==="home") filter="hepsi"; tabTo(v); }
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("scrim").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
function backBar(t) { return '<div class="back"><button onclick="back()" aria-label="Geri">←</button>'+t+'</div>'; }

function render() {
  var m = me(), v = document.getElementById("view");
  var root = ["home","search","rewards","dev","profile"];
  var navTab = root.indexOf(view) > -1 ? view : (view==="detail"||view==="library"?"home":(view==="plans"||view==="settings"||view==="about"||view==="favs"||view==="founder"||view==="adminroom"?"profile":(view==="leaderboard"?"rewards":"")));
  document.querySelectorAll("nav button").forEach(function(b){b.setAttribute("aria-current",b.dataset.tab===navTab?"true":"false")});
  
  document.getElementById("avBtn").textContent = m ? m.name.charAt(0).toUpperCase() : "?";
  document.getElementById("dUser").textContent = m ? m.name + " ("+(m.role||"üye")+") · "+fmt(m.points)+" P" : "Giriş yapılmadı";
  document.getElementById("top").style.display = (view==="search") ? "none" : "block";

  var fn = {
    home: vHome, search: vSearch, dev: vDev, profile: vProfile, plans: vPlans,
    settings: vSettings, about: vAbout, detail: vDetail, library: vLibrary,
    rewards: vRewards, leaderboard: vBoard, favs: vFavs, founder: vFounderRoom, adminroom: vAdminRoom, ticket: vTicketRoom
  }[view] || vHome;

  v.innerHTML = fn(m);
  if (view === "search") { var i = document.getElementById("q"); if(i) { i.focus(); doSearch(); } }
  window.scrollTo(0,0);
}

/* --- EKRAN FONKSİYONLARI --- */
function appRow(a) {
  return '<button class="item" onclick="go(\'detail\',\''+a.id+'\')">'+icoHTML(a)+'<div class="m"><b>'+esc(a.name)+'</b><span>'+esc(a.dev)+' · '+(a.cat==="oyun"?"Oyun":"Uygulama")+(isInst(a.id)?' · Kurulu':'')+(a.price>0?' · '+fmt(a.price)+' P':'')+'</span></div></button>';
}

function vHome() {
  var l = allApps().filter(function(a){ return filter==="hepsi" || a.cat===filter; });
  var h = '<div class="hero"><div class="mark" aria-hidden="true">H</div><h1>Zırhlı Yerli Mağaza</h1><p>Merkezisiz, güvenli ve dosya tabanlı çekirdek sistem.</p><div class="row"><button class="btn on-dark sm" onclick="tabTo(\'dev\')">+ Uygulama Ekle</button></div></div>';
  h += shelfHTML();
  h += '<div class="chips" style="margin-top:14px">'+[["hepsi","Hepsi"],["oyun","Oyunlar"],["uygulama","Uygulamalar"]].map(function(c){return'<button class="chip" aria-pressed="'+(filter===c[0])+'" onclick="filter=\''+c[0]+'\';render()">'+c[1]+'</button>'}).join("")+'</div>';
  if (!l.length) return h + '<div class="empty"><div class="big">📭</div>Bu kategoride henüz uygulama yok.</div>';
  h += '<h2>Tüm Uygulamalar</h2>' + l.map(appRow).join("");
  return h;
}

function shelfHTML() {
  var inst = allApps().filter(function(a){ return isInst(a.id); });
  var h = '<h2>Ana Ekranım</h2>';
  if (!inst.length) return h + '<div class="card"><div class="muted">Kurduğun oyunlar ve uygulamalar burada görünür.</div></div>';
  return h + '<div class="grid">' + inst.map(function(a){ return '<button class="gi" onclick="runApp(\''+a.id+'\')" aria-label="'+esc(a.name)+' aç">'+icoHTML(a)+'<span>'+esc(a.name)+'</span></button>'; }).join("") + '</div>';
}

function vSearch() {
  return '<div class="bar" style="margin:10px 0"><button class="ib" onclick="tabTo(\'home\')" aria-label="Geri">←</button><input id="q" type="search" placeholder="Oyun veya uygulama ara" oninput="doSearch()" style="border:0;background:none;padding:10px 4px;margin:0"></div><div id="res"></div>';
}
function doSearch() {
  var q = (document.getElementById("q").value||"").trim().toLowerCase(), r = document.getElementById("res");
  var l = allApps().filter(function(a){ return !q || (a.name+" "+a.desc+" "+a.dev+" "+a.cat).toLowerCase().indexOf(q) > -1; });
  r.innerHTML = l.length ? l.map(appRow).join("") : '<div class="empty"><div class="big">🔍</div>"'+esc(q)+'" için sonuç bulunamadı.</div>';
}

function vDetail() {
  var a = appById(vid); if(!a) return backBar("Uygulama")+'<div class="empty">Bulunamadı.</div>';
  var m = me();
  var inst = isInst(a.id);
  var h = backBar("") + '<div class="row" style="align-items:flex-start;gap:16px">'+icoHTML(a).replace('class="ico "', 'class="ico" style="width:84px;height:84px;font-size:42px;border-radius:20px;background:'+colorOf(a.id)+'"')+'<div><div style="font-size:22px;font-weight:800">'+esc(a.name)+'</div><div class="muted">'+esc(a.dev)+'</div><div class="muted">'+(a.cat==="oyun"?"Oyun":"Uygulama")+' · v'+esc(a.ver)+'</div>'+(a.price>0?'<div style="color:var(--brass);font-weight:700;margin-top:4px">Fiyat: '+fmt(a.price)+' Puan</div>':'')+'</div></div>';
  
  h += '<div class="row" style="margin:18px 0" id="ab">';
  if (inst) {
    h += '<button class="btn" style="flex:1" onclick="runApp(\''+a.id+'\')">Aç</button><button class="btn alt" onclick="uninstall(\''+a.id+'\')">Kaldır</button>';
  } else {
    if (a.price > 0 && m && m.name !== a.dev && !["kurucu","owner","co-owner","bas-admin","kidemli-admin","admin"].includes(m.role)) {
      h += '<button class="btn" style="flex:1" onclick="buyApp(\''+a.id+'\')">Satın Al ('+fmt(a.price)+' P)</button>';
      h += '<button class="btn alt" onclick="openOfferModal(\''+a.id+'\')">Teklif İste</button>';
    } else {
      h += '<button class="btn" style="flex:1" onclick="install(\''+a.id+'\')">Kur</button>';
    }
  }
  h += '</div><div class="card"><h3>Hakkında</h3><div class="muted">'+esc(a.desc)+'</div></div>';
  return h;
}

function buyApp(id) {
  var m = me(), a = appById(id);
  if (!m) return tabTo("profile");
  if (m.points < a.price) return toast("Yetersiz puan!");
  m.points -= a.price;
  saveMe(m);
  var d = loadDB();
  d.installed.push(id);
  saveDB(d);
  logAction(m.name + ", " + a.name + " adlı ücretli uygulamayı satın aldı.");
  toast("Satın alma başarılı, kuruldu!");
  render();
}

function openOfferModal(id) {
  var m = me(), a = appById(id);
  if (!m) return tabTo("profile");
  var reason = prompt("Yetkililere teklif veya indirim sebebi yazın:");
  if (!reason) return;
  var d = loadDB();
  var ticketId = "t_" + Date.now();
  d.tickets.push({ id: ticketId, appId: id, appName: a.name, user: m.name, reason: reason, status: "açık" });
  saveDB(d);
  logAction(m.name + ", " + a.name + " için teklif talebi açtı.");
  toast("Teklif talebi log kanalına iletildi!");
  go("ticket", ticketId);
}

function install(id) {
  var d = loadDB();
  if (d.installed.indexOf(id) < 0) d.installed.push(id);
  saveDB(d);
  toast("Kuruldu!");
  render();
}
function uninstall(id) {
  var d = loadDB();
  d.installed = d.installed.filter(function(x){ return x !== id; });
  saveDB(d);
  toast("Kaldırıldı");
  render();
}

function vLibrary() {
  var l = allApps().filter(function(a){ return isInst(a.id); });
  return backBar("Kurduklarım") + (l.length ? l.map(appRow).join("") : '<div class="empty"><div class="big">📥</div>Henüz kurulu bir şey yok.</div>');
}

/* --- PROFİL & YETKİLER --- */
function vProfile(m) {
  if (!m) {
    return '<div class="card" style="margin-top:8px"><h3>Giriş / Kayıt</h3><label>Kullanıcı Adı</label><input id="u"><label>Şifre</label><input id="p" type="password"><div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="auth(false)">Giriş</button><button class="btn alt" style="flex:1" onclick="auth(true)">Kayıt Ol</button></div></div>';
  }
  var isKurucu = (m.name === "EYO PAŞA!" || m.role === "kurucu");
  var isAdminOrStaff = isKurucu || ["owner","co-owner","bas-admin","kidemli-admin","admin"].includes(m.role);

  var h = '<div class="card" style="margin-top:8px;text-align:center"><div class="av" style="width:72px;height:72px;font-size:30px;margin:0 auto 10px">'+esc(m.name.charAt(0))+'</div><div style="font-size:20px;font-weight:800">'+esc(m.name)+'</div><div class="muted">Rol: <b>'+(m.role||"Üye")+'</b> · Puan: <b>'+fmt(m.points)+'</b></div>';
  h += '<div class="stats"><div><b>'+(m.apps||[]).length+'</b><span>Yayınlanan</span></div><div><b>'+loadDB().installed.length+'</b><span>Kurulan</span></div></div>';
  h += '</div>';

  if (isKurucu) {
    h += '<div class="card" style="background:var(--ink);color:var(--bg)"><h3>👑 Kurucu Özel Alanı</h3><div class="muted" style="color:#aaa">Merkezisiz dosya sunucusu ve tam yetki odası.</div><button class="btn full" style="margin-top:10px" onclick="go(\'founder\')">Gizli Kurucu Odasına Gir</button></div>';
  }
  if (isAdminOrStaff) {
    h += '<div class="card"><h3>🛡️ Admin & Log Odası</h3><button class="btn alt full" onclick="go(\'adminroom\')">Yönetim ve Log Paneline Git</button></div>';
  }

  h += '<div class="card" style="padding:0 14px">';
  [["🎁","Ödüller","rewards"],["⭐","Favoriler","favs"],["🏆","Sıralama","leaderboard"],["📥","Kurduklarım","library"],["🛠️","Geliştirici","dev"],["⚙️","Ayarlar","settings"],["ℹ️","Hakkında","about"]].forEach(function(r){
    h += '<button class="set" style="width:100%;border:0;background:none;text-align:left" onclick="go(\''+r[2]+'\')"><span>'+r[0]+'&nbsp;&nbsp;'+r[1]+'</span><span class="muted">›</span></button>';
  });
  return h + '</div><button class="btn alt full" onclick="logout()">Çıkış Yap</button>';
}

function auth(isReg) {
  var u = (document.getElementById("u").value||"").trim();
  var p = (document.getElementById("p").value||"").trim();
  if (!u || !p) return toast("Bilgileri doldur!");
  var d = loadDB();
  if (u === "EYO PAŞA!" && p === "Mr_eyo9801234509") {
    d.users["EYO PAŞA!"] = d.users["EYO PAŞA!"] || { name: "EYO PAŞA!", points: 999999, role: "kurucu" };
    d.users["EYO PAŞA!"].role = "kurucu";
    saveDB(d);
    setSes("EYO PAŞA!");
    toast("Kurucu girişi yapıldı!");
    render();
    return;
  }
  if (isReg) {
    if (d.users[u]) return toast("Bu kullanıcı adı alınmış!");
    d.users[u] = { name: u, pass: p, role: "uye", points: 500, xp: 500, apps: [], favs: [], installed: [] };
    saveDB(d);
    setSes(u);
    logAction("Yeni kullanıcı kayıt oldu: " + u);
    toast("Kayıt olundu, 500 puan hediye!");
  } else {
    var usr = d.users[u];
    if (!usr || usr.pass !== p) return toast("Hatalı kullanıcı adı veya şifre!");
    setSes(u);
    toast("Giriş başarılı!");
  }
  render();
}
function logout() { setSes(null); toast("Çıkış yapıldı"); render(); }

/* --- KURUCU GİZLİ OYUN & SUNUCU ODASI --- */
function vFounderRoom() {
  var m = me();
  if (!m || m.name !== "EYO PAŞA!") return backBar("Hata") + '<div class="card">Bu odaya sadece Kurucu (EYO PAŞA!) girebilir!</div>';
  var d = loadDB();
  var usersList = Object.keys(d.users).map(function(uname){
    var usr = d.users[uname];
    return '<div class="set"><div><b>'+esc(uname)+'</b><small>Rol: '+esc(usr.role||"üye")+' · Puan: '+fmt(usr.points)+'</small></div>' +
           '<select onchange="changeRole(\''+uname+'\', this.value)">' +
           '<option value="uye" '+(usr.role==="uye"?"selected":"")+'>Üye</option>' +
           '<option value="admin" '+(usr.role==="admin"?"selected":"")+'>Admin</option>' +
           '<option value="kidemli-admin" '+(usr.role==="kidemli-admin"?"selected":"")+'>Kıdemli Admin</option>' +
           '<option value="bas-admin" '+(usr.role==="bas-admin"?"selected":"")+'>Baş Admin</option>' +
           '<option value="co-owner" '+(usr.role==="co-owner"?"selected":"")+'>Co-Owner</option>' +
           '<option value="owner" '+(usr.role==="owner"?"selected":"")+'>Owner</option>' +
           '</select></div>';
  }).join("");

  return backBar("Kurucu Gizli Odası") +
    '<div class="card" style="background:var(--ink);color:var(--bg)"><h3>💻 Merkezisiz Yerel Sunucu Dosyası</h3>' +
    '<div class="muted" style="color:#bbb">Tüm veriler cihazda şifreli <b>hukum_core_vault.enc</b> dosya bloğunda tutuluyor.</div>' +
    '<button class="btn sm on-dark" style="margin-top:10px" onclick="exportVault()">Sunucu Dosyasını İndir / Yedekle</button></div>' +
    '<div class="card"><h3>👥 Kullanıcılar ve Yetki Dağıtımı</h3><div class="muted">İstediğin kullanıcıyı yetkilendir veya rutbesini geri al.</div>' + usersList + '</div>';
}

function changeRole(uname, newRole) {
  var d = loadDB();
  if (d.users[uname]) {
    d.users[uname].role = newRole;
    saveDB(d);
    logAction("Kurucu, " + uname + " kullanıcısının rolünü " + newRole + " yaptı.");
    toast(uname + " yetkisi güncellendi: " + newRole);
    render();
  }
}

function exportVault() {
  var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(localStorage.getItem(DB_KEY));
  var dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "hukum_core_vault.enc");
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
  toast("Sunucu dosya bloğu indirildi!");
}

/* --- ADMIN VE LOG ODASI --- */
function vAdminRoom() {
  var d = loadDB();
  var logsHTML = d.logs.map(function(l){ return '<div style="font-family:monospace;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)">['+new Date(l.t).toLocaleTimeString()+'] '+esc(l.txt)+'</div>'; }).join("");
  var ticketsHTML = d.tickets.map(function(t){
    return '<div class="card"><b>'+esc(t.appName)+'</b> - İsteyen: <i>'+esc(t.user)+'</i><div class="muted">Sebep: '+esc(t.reason)+'</div>' +
           '<div class="row" style="margin-top:10px"><button class="btn sm" onclick="resolveTicket(\''+t.id+'\', true)">Onayla & Ver</button><button class="btn alt sm" onclick="resolveTicket(\''+t.id+'\', false)">Reddet / Kapat</button></div></div>';
  }).join("") || '<div class="muted">Bekleyen teklif veya talep yok.</div>';

  return backBar("Yönetim & Log Kulesi") +
    '<div class="card"><h3>📜 Canlı Loglama Kulesi</h3><div style="max-height:200px;overflow-y:auto">'+logsHTML+'</div></div>' +
    '<div class="card"><h3>🤝 Geliştirici & Ürün Teklifleri (Denetim)</h3>'+ticketsHTML+'</div>';
}

function resolveTicket(tid, approved) {
  var d = loadDB();
  var t = d.tickets.filter(function(x){ return x.id === tid; })[0];
  if (!t) return;
  if (approved) {
    if (d.installed.indexOf(t.appId) < 0) d.installed.push(t.appId);
    logAction(t.user + " için " + t.appName + " talebi yetkililerce onaylandı.");
    toast("Talep onaylandı ve uygulama kullanıcıya verildi!");
  } else {
    logAction(t.user + " için " + t.appName + " talebi reddedildi.");
    toast("Talep reddedildi.");
  }
  d.tickets = d.tickets.filter(function(x){ return x.id !== tid; });
  saveDB(d);
  render();
}

function vTicketRoom() { return backBar("Teklif Kanalı") + '<div class="card"><h3>Teklifiniz Alındı</h3><div class="muted">Yetkililer ve Kurucu log kanalından inceleyip onayladığında uygulamanız açılacak veya kurulacaktır.</div></div>'; }

/* --- GELİŞTİRİCİ & 4 AŞAMALI YAYINLAMA --- */
var PUBLISH_COST = 10000;
var ICONS = ["🎮","🧩","🎯","⚔️","🎲","🚀","🧱","🏎️","⚽","👾"];
function pickIcon(b) { document.querySelectorAll("#icp .chip").forEach(function(c){c.setAttribute("aria-pressed","false")}); b.setAttribute("aria-pressed","true"); }

function vDev(m) {
  if (!m) return '<h2 style="margin-top:6px">Geliştirici Paneli</h2><div class="card"><div class="muted">Uygulama yayınlamak için giriş yapmalısın.</div></div><button class="btn full" onclick="tabTo(\'profile\')">Giriş Yap</button>';
  
  var h = '<h2 style="margin-top:6px">Uygulama / Oyun Yayınla</h2>' +
          '<div class="card"><label for="an">Uygulama Adı</label><input id="an" maxlength="30">' +
          '<label for="ad">Kısa Açıklama</label><input id="ad" maxlength="80">' +
          '<label for="ac">Kategori</label><select id="ac"><option value="oyun">Oyun</option><option value="uygulama">Uygulama</option></select>' +
          '<label>Yayınlanma Şekli</label><select id="pubType" onchange="togglePriceBox(this.value)">' +
          '<option value="1">1. Bedava</option>' +
          '<option value="2">2. Ücretli (Max 30 Bin Puan)</option>' +
          '<option value="3">3. Seçilen Kullanıcıya Özel / Bedava Ver</option>' +
          '<option value="4">4. Teklif İsteme Modu (Anlaşma ve Denetim)</option>' +
          '</select>' +
          '<div id="priceBox" style="display:none"><label for="aprice">Ücret (Puan cinsinden, max 30000)</label><input id="aprice" type="number" max="30000" value="1000"></div>' +
          '<div id="targetBox" style="display:none"><label for="atarget">Hangi Kullanıcıya Verilecek? (Kullanıcı Adı)</label><input id="atarget" placeholder="Örn: Ahmet123"></div>' +
          '<label>Simge</label><div class="chips" id="icp">'+ICONS.map(function(e,i){return'<button class="chip" style="font-size:20px" aria-pressed="'+(i===0)+'" onclick="pickIcon(this)">'+e+'</button>'}).join("")+'</div>' +
          '<label for="nc">Kod (HTML / JS / CSS)</label><textarea id="nc" placeholder="<h1>Merhaba</h1>"></textarea>' +
          '<button class="btn full" style="margin-top:10px" onclick="publishApp()">Hemen Yayınla</button></div>';
  return h;
}

function togglePriceBox(val) {
  document.getElementById("priceBox").style.display = (val === "2") ? "block" : "none";
  document.getElementById("targetBox").style.display = (val === "3") ? "block" : "none";
}

function publishApp() {
  var m = me(); if(!m) return tabTo("profile");
  var name = (document.getElementById("an").value||"").trim();
  var desc = (document.getElementById("ad").value||"").trim();
  var cat = document.getElementById("ac").value;
  var pubType = document.getElementById("pubType").value;
  var price = 0;
  var targetUser = "";
  if (pubType === "2") {
    price = parseInt(document.getElementById("aprice").value || 0);
    if (price > 30000) return toast("Ücret en fazla 30 bin puan olabilir!");
  }
  if (pubType === "3") {
    targetUser = (document.getElementById("atarget").value||"").trim();
    if (!targetUser) return toast("Kullanıcı adı girmelisin!");
  }
  var iconEl = document.querySelector("#icp .chip[aria-pressed='true']");
  var icon = iconEl ? iconEl.getAttribute("data-e") || iconEl.textContent : "📦";
  var code = document.getElementById("nc").value;

  if (!name || !code) return toast("İsim ve kod zorunludur!");

  m.apps = m.apps || [];
  var newApp = { id: "app_" + Date.now(), name: name, desc: desc, cat: cat, icon: icon, ver: "1.0", code: code, price: price, targetUser: targetUser };
  m.apps.push(newApp);
  saveMe(m);
  logAction(m.name + " yeni uygulama yayınladı: " + name);
  toast("Uygulama başarıyla yayınlandı!");
  tabTo("home");
}

/* --- RUNNER & DİĞERLERİ --- */
function runApp(id) {
  var a = appById(id); if(!a || !a.code) return toast("Çalıştırılacak kod yok!");
  document.getElementById("runName").textContent = a.name;
  var fr = document.getElementById("runFrame");
  fr.srcdoc = a.code;
  document.getElementById("runner").classList.add("open");
}
function closeRunner() { document.getElementById("runner").classList.remove("open"); document.getElementById("runFrame").srcdoc = ""; }

function vRewards(m) {
  return '<h2 style="margin-top:6px">Ödüller ve Görevler</h2>' +
         '<div class="card"><h3>Günlük Giriş</h3><div class="muted">Her gün girerek puanları topla.</div>' +
         '<button class="btn full" style="margin-top:10px" onclick="dailyClaim()">Günlük Puanı Al (+100 P)</button></div>';
}
function dailyClaim() { var m = me(); if(!m) return tabTo("profile"); m.points += 100; saveMe(m); toast("+100 Puan eklendi!"); render(); }

function vFavs() { return backBar("Favorilerim") + '<div class="empty">Henüz favori yok.</div>'; }
function vBoard() { return backBar("Sıralama") + '<div class="card"><h3>👑 Liderlik Tablosu</h3><div class="muted">1. EYO PAŞA! (Kurucu) - 999.999 P</div></div>'; }
function vSettings() { return backBar("Ayarlar") + '<div class="card"><button class="btn alt full" onclick="wipe()">Tüm Verileri Sıfırla (Wipe)</button></div>'; }
function wipe() { if(confirm("Tüm veriler silinsin mi?")) { localStorage.clear(); location.reload(); } }
function vAbout() { return backBar("Hakkında") + '<div class="card" style="text-align:center"><h3>HÜKÜM STORE</h3><div class="muted">Merkezisiz ve Zırhlı Dijital İmparatorluk Mimarisi. v1.0</div></div>'; }

/* Başlangıç Render */
render();
</script>
